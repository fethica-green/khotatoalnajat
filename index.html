      if(z.x<-80||z.x>WORLD+80)G.zs.splice(i,1);continue;}
    if(z.daze>0){z.daze-=dt;z.mode='daze';z.moving=false;continue;}
    let tx,mode,best=null,bd=1e9;
    for(const d of G.decoys){if(d.fly>0)continue;const dd=Math.abs(d.x-z.x);if(dd<lureR&&dd<bd){bd=dd;best=d;}}
    if(best){tx=best.x+z.off;mode='lure';z.lured=true;}
    else if(G.horn.t>0){tx=CAR+z.off*1.6;mode='lure';z.lured=true;}
    else{if(z.lured){z.lured=false;if(Math.random()<.4)z.leaving=true;else z.daze=2.6;continue;}
      if(Math.abs(h.x-z.x)<(demo?400:gat?210:110)){tx=h.x-(demo?Math.sign(h.x-z.x)*30:0);mode='hero';}
      else if(gat){if(z.wx==null||Math.abs(z.wx-z.x)<10)z.wx=rnd(60,WORLD-60);tx=z.wx;mode='wander';}else{tx=DOOR+(z.x<DOOR?-1:1)*(28+z.slot);mode='door';}}
    const dx=tx-z.x;
    if(Math.abs(dx)>6){z.dir=Math.sign(dx);z.x+=z.dir*z.sp*(mode==='lure'?1.25:1)*dt;z.ph+=dt*z.sp/8;z.moving=true;}
    else{z.moving=false;if(mode==='door'){attackers+=z.brute?2:1;z.dir=z.x<DOOR?1:-1;z.ph+=dt*6;}}
    z.mode=mode;
    const touch=!demo&&mode!=='lure'&&G.state==='play'&&Math.abs(h.x-z.x)<26&&h.inv<=0&&z.biteCd<=0;z.grab=touch?z.grab+dt:0;
    if(z.grab>df.bw){z.grab=0;h.hp--;h.inv=1.6;z.biteCd=1.5;G.shake=.35;sfx.hurt();puff(h.x,GY-70,'#ff5a4a',8);
      h.x=clamp(h.x+(h.x>=z.x?1:-1)*70,30,WORLD-30);
      if(h.hp<=0){gameOver('bite');return;}}
  }
  G.danger=attackers>0||h.hp<=1;
  if(attackers&&G.state==='play'&&!demo){dr.hp-=Math.min(attackers,5)*2*df.dd*dt;dr.hit=.12;dr.snd-=dt;if(dr.snd<=0){dr.snd=.55;sfx.door();}
    if(dr.hp<=0){dr.hp=0;gameOver('door');return;}}
  dr.hit-=dt;G.shake-=dt;
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;if(p.t<=0)G.parts.splice(i,1);}
  camX+=(clamp(h.x+(demo?0:h.dir*40)-VW/2,0,Math.max(0,WORLD-VW))-camX)*Math.min(1,dt*6);
}

  }else if(b==='parking'){

    ink(4);rr(1100,GY-52,110,12,5,'#fff');rr(1100,GY-62,26,12,5,'#dfe9ef');ln(1110,GY-40,1110,GY-10);ln(1200,GY-40,1200,GY-10);circ(1110,GY-8,7,'#333');circ(1200,GY-8,7,'#333');
    ln(1470,GY,1470,GY-120);ln(1470,GY-120,1486,GY-120);rr(1478,GY-118,16,26,4,'#bfe6ff');

function drawEntities(g,tt){
  for(const p of g.picks){const by=Math.sin(tt*4+p.x)*3;ink(4);if(p.type==='phone'){circ(p.x,GY-16+by,15,'rgba(255,210,122,.25)',false);rr(p.x-7,GY-27+by,14,24,3,'#223');c.fillStyle='#59d0ff';c.fillRect(p.x-4,GY-23+by,8,13);}

    else{c.save();c.translate(p.x,GY-10+by);c.rotate(-.2);rr(-22,-6,44,12,3,'#c9a36a');c.restore();}}
  for(const d of g.decoys){let x=d.x,y=GY-8;if(d.fly>0){const k=1-d.fly/.45;x=d.x0+(d.x-d.x0)*k;y=GY-60-Math.sin(k*Math.PI)*120+k*52;}
    else{c.strokeStyle='rgba(255,210,122,.9)';c.lineWidth=3;for(let i=0;i<2;i++){c.beginPath();c.arc(x,y-6,14+i*12+(tt*50%12),-2.6,-.54);c.stroke();}}

      lean:st?-.35:.14,s:z.runner?.92:z.brute?1.28:1});
    const hy=GY-(z.brute?146:114);c.font='900 22px Cairo,sans-serif';c.textAlign='center';
    if(st){c.fillStyle='#ffd23a';c.fillText('✦',z.x+Math.cos(tt*9)*12,hy);}
    else if(z.mode==='lure'){c.fillStyle='#ffd27a';c.fillText('♪',z.x,hy+Math.sin(tt*6+z.ph)*3);}
    else if(z.mode==='daze'){c.fillStyle='#fff';c.fillText('؟',z.x,hy);}
    else if(z.grab>0){c.fillStyle='#ff5a4a';c.font='900 30px Cairo,sans-serif';c.fillText('!',z.x,hy);}

  if(h.shT>0){c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=5;c.beginPath();c.arc(h.x+h.dir*30,GY-58,34+(.25-h.shT)*120,h.dir>0?-.8:Math.PI-.8,h.dir>0?.8:Math.PI+.8);c.stroke();}

}
function draw(){
  const w=cv.width,hh=cv.height;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,w,hh);
  const dpr=w/cv.clientWidth;c.setTransform(S*dpr,0,0,S*dpr,0,0);
  if(!G)return;const tt=TT=G.time,th=THEMES[G.theme];
  const day=G.demo?0:(G.state==='dawn'||G.state==='up'?1:clamp((G.t-LEN*.86)/(LEN*.14),0,1));
  if(MG[G.mode]){MG[G.mode].draw(tt,th);return;}
  drawScene(th,tt,day,G);
  if(G.haz&&G.state==='play'&&!G.demo){const hx=G.hero.x-camX;
    if(th.haz==='storm'){c.fillStyle='rgba('+th.hzc+',.25)';c.fillRect(0,0,VW,VH);c.strokeStyle='rgba(240,200,140,.5)';c.lineWidth=2;
      for(let i=0;i<34;i++){const x=VW-((tt*620+i*97)%(VW+120)),y=(i*53+Math.sin(i)*40)%GY;ln(x,y,x+46,y-6);}}
    const gr=c.createRadialGradient(hx,GY-60,th.haz==='dark'?120:150,hx,GY-60,th.haz==='dark'?330:400);gr.addColorStop(0,'rgba('+th.hzc+',0)');gr.addColorStop(1,'rgba('+th.hzc+','+(th.haz==='dark'?.93:.85)+')');c.fillStyle=gr;c.fillRect(0,0,VW,VH);}
}

/* ---------- HUD ---------- */
const cache={};function setH(id,prop,v){const k=id+prop;if(cache[k]!==v){cache[k]=v;if(prop==='w')$(id).style.width=v;else if(prop==='c')$(id).className=v;else $(id).textContent=v;}}
function hud(){if(!G||G.demo)return;const h=G.hero,th=THEMES[G.theme];
  setH('night','t',t('day')+' '+G.day+'/'+DAYS);setH('clock','t',clockStr());
  setH('hearts','t','❤️'.repeat(Math.max(0,h.hp))+'🖤'.repeat(Math.max(0,h.maxHp-h.hp)));
  setH('doorbar','w',((G.mode==='defend'?G.door.hp/G.door.max:G.mode==='gather'?G.food/G.quota:clamp(G.prog||0,0,1))*100|0)+'%');setH('stambar','w',(h.st|0)+'%');
  setH('nph','t',G.phones);
  const nearCar=Math.abs(h.x-CAR)<85,nearDoor=Math.abs(h.x-DOOR)<62;
  if(nearCar){$('bact').firstChild.nodeValue=th.lic;setH('nact','t',G.horn.cd>0?Math.ceil(G.horn.cd):'✔');setH('bact','c','b'+(G.horn.cd>0?' dim':'')+(inp.act?' on':''));}
  else if(G.mode==='gather'){$('bact').firstChild.nodeValue=th.lic;setH('nact','t','…');setH('bact','c','b dim');}
  else{$('bact').firstChild.nodeValue='🔨';setH('nact','t',G.planks);setH('bact','c','b'+(nearDoor&&G.planks>0&&G.door.hp<G.door.max?'':' dim')+(inp.act?' on':''));}
  setH('bph','c','b'+(G.phones>0?'':' dim'));setH('bsh','c','b big'+(h.st<22?' dim':''));
}

/* ---------- input ---------- */
function hold(id,dn,up){const e=$(id);const d=ev=>{ev.preventDefault();try{e.setPointerCapture(ev.pointerId)}catch(x){}e.classList.add('on');dn();},
  u=ev=>{e.classList.remove('on');up&&up();};e.addEventListener('pointerdown',d);e.addEventListener('pointerup',u);e.addEventListener('pointercancel',u);
  e.addEventListener('contextmenu',ev=>ev.preventDefault());}
hold('bl',()=>{inp.l=true;inp.lP=true},()=>inp.l=false);hold('br',()=>{inp.r=true;inp.rP=true},()=>inp.r=false);
hold('bsh',()=>inp.shoveP=true);hold('bph',()=>inp.phoneP=true);hold('bact',()=>{inp.act=true;inp.actP=true},()=>inp.act=false);
cv.addEventListener('pointerdown',e=>{if(!G||G.demo||G.state!=='play'||e.clientY<70)return;const x=e.clientX/S,y=e.clientY/S,m=G.mode;
  if(m==='runner')inp.shoveP=true;else if(m==='doors')MG.doors.tap(x,y);else if(m==='lanes'){if(x<VW/2)inp.lP=true;else inp.rP=true;}
  else if(ENG(m)&&y<GY+110)inp.throwX=camX+x;});
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.code;if(k==='ArrowLeft'||k==='KeyA'){inp.l=true;inp.lP=true;}else if(k==='ArrowRight'||k==='KeyD'){inp.r=true;inp.rP=true;}
  else if(k==='Space'||k==='ArrowUp'){inp.shoveP=true;e.preventDefault();}else if(k==='KeyF')inp.phoneP=true;else if(k==='KeyE'){inp.act=true;inp.actP=true;}
  else if(k==='Escape'||k==='KeyP')togglePause();});
addEventListener('keyup',e=>{const k=e.code;if(k==='ArrowLeft'||k==='KeyA')inp.l=false;else if(k==='ArrowRight'||k==='KeyD')inp.r=false;else if(k==='KeyE')inp.act=false;});
addEventListener('blur',()=>{inp.l=inp.r=inp.act=false;});
function togglePause(){if(!G||G.demo)return;if(G.state==='play'){G.state='pause';show('sPause');}else if(G.state==='pause'){G.state='play';show(null);}}
$('pauseB').onclick=()=>{sfx.ui();togglePause();};$('resume').onclick=()=>{sfx.ui();togglePause();};
$('pMus').onclick=()=>{setMus(!SV.music);sfx.ui();};$('pSnd').onclick=()=>{setSfx(!SV.sfx);sfx.ui();};
$('pMenu').onclick=$('endMenu').onclick=()=>{sfx.ui();goHome();};
$('sndB').onclick=()=>{initAudio();const on=!(SV.sfx||SV.music);setMus(on);setSfx(on);sfx.ui();};
for(const e of document.querySelectorAll('.langB'))e.onclick=()=>{initAudio();LANG=LANG==='ar'?'en':'ar';SV.lang=LANG;save();voStop();applyLang();sfx.ui();};
for(const e of document.querySelectorAll('[data-back]'))e.onclick=()=>{sfx.ui();voStop();show(e.dataset.back);};
$('fsB').onclick=()=>{try{const d=document;if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen().catch(()=>{});}catch(e){}};
if(!document.documentElement.requestFullscreen)$('fsB').style.display='none';
$('play').onclick=()=>{initAudio();sfx.ui();goThemes();};
$('again').onclick=()=>{sfx.ui();if(endFn)endFn();};

/* ---------- loop ---------- */
function resize(){const cw=innerWidth,ch=innerHeight,dpr=Math.min(2,devicePixelRatio||1);cv.width=cw*dpr;cv.height=ch*dpr;
  if(cw/ch<.8){VW=470;S=cw/VW;VH=ch/S;GY=VH-250;}else{VH=760;S=ch/VH;VW=cw/S;GY=VH-170;}}
addEventListener('resize',()=>{resize();fit();});resize();applyLang();demoStart();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if($('sThemes').classList.contains('on'))buildTiles();});
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!document.hidden){update(dt);draw();hud();}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__game={get G(){return G},inp,update,newRun,goThemes,goDiff,SV,MG};
